openapi: 3.0.3
info:
  title: 'MailMaster API Documentation'
  description: 'API documentation for the MailMaster newsletter management system'
  version: 1.0.0
servers:
  -
    url: 'http://localhost'
tags:
  -
    name: 'Campaign Management'
    description: "\nAPI endpoints for managing campaign sending and statistics"
  -
    name: Endpoints
    description: ''
paths:
  '/api/campaigns/{id}/send':
    post:
      summary: 'Send a campaign'
      operationId: sendACampaign
      description: 'Sends the campaign to all active subscribers in the associated newsletter.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: true
                  message: 'Campaign sent successfully: 10 sent, 0 failed'
                  sent_count: 10
                  failed_count: 0
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Campaign sent successfully: 10 sent, 0 failed'
                  sent_count:
                    type: integer
                    example: 10
                  failed_count:
                    type: integer
                    example: 0
        400:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: false
                  message: 'This campaign has already been sent'
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'This campaign has already been sent'
      tags:
        - 'Campaign Management'
      security: []
    parameters:
      -
        in: path
        name: id
        description: 'The ID of the campaign to send.'
        example: '1'
        required: true
        schema:
          type: string
  '/api/campaigns/{id}/schedule':
    post:
      summary: 'Schedule a campaign'
      operationId: scheduleACampaign
      description: 'Schedule a campaign for future sending.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Campaign scheduled successfully'
                  campaign:
                    id: 1
                    newsletter_id: 1
                    name: 'Example Campaign'
                    subject: 'Important Announcement'
                    status: scheduled
                    scheduled_at: '2023-05-15T10:00:00.000000Z'
                    updated_at: '2023-04-07T12:00:00.000000Z'
                    created_at: '2023-04-07T12:00:00.000000Z'
                properties:
                  message:
                    type: string
                    example: 'Campaign scheduled successfully'
                  campaign:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      newsletter_id:
                        type: integer
                        example: 1
                      name:
                        type: string
                        example: 'Example Campaign'
                      subject:
                        type: string
                        example: 'Important Announcement'
                      status:
                        type: string
                        example: scheduled
                      scheduled_at:
                        type: string
                        example: '2023-05-15T10:00:00.000000Z'
                      updated_at:
                        type: string
                        example: '2023-04-07T12:00:00.000000Z'
                      created_at:
                        type: string
                        example: '2023-04-07T12:00:00.000000Z'
      tags:
        - 'Campaign Management'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                scheduled_at:
                  type: datetime
                  description: 'The date and time to send the campaign.'
                  example: '2023-05-15 10:00:00'
                  nullable: false
              required:
                - scheduled_at
      security: []
    parameters:
      -
        in: path
        name: id
        description: 'The ID of the campaign to schedule.'
        example: '1'
        required: true
        schema:
          type: string
  '/api/campaigns/{id}/stats':
    get:
      summary: 'Get campaign statistics'
      operationId: getCampaignStatistics
      description: 'Retrieve statistics for a specific campaign.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  campaign_id: 1
                  campaign_name: 'Example Campaign'
                  sent_at: '2023-04-07T12:00:00.000000Z'
                  total_subscribers: 100
                  opened_count: 75
                  open_rate: 75
                  clicks_count: 25
                  click_rate: 25
                  recent_opens:
                    -
                      id: 10
                      subscriber_id: 20
                      opened_at: '2023-04-07T15:30:00.000000Z'
                      subscriber:
                        id: 20
                        email: example@example.com
                        first_name: John
                        last_name: Doe
                properties:
                  campaign_id:
                    type: integer
                    example: 1
                  campaign_name:
                    type: string
                    example: 'Example Campaign'
                  sent_at:
                    type: string
                    example: '2023-04-07T12:00:00.000000Z'
                  total_subscribers:
                    type: integer
                    example: 100
                  opened_count:
                    type: integer
                    example: 75
                  open_rate:
                    type: integer
                    example: 75
                  clicks_count:
                    type: integer
                    example: 25
                  click_rate:
                    type: integer
                    example: 25
                  recent_opens:
                    type: array
                    example:
                      -
                        id: 10
                        subscriber_id: 20
                        opened_at: '2023-04-07T15:30:00.000000Z'
                        subscriber:
                          id: 20
                          email: example@example.com
                          first_name: John
                          last_name: Doe
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 10
                        subscriber_id:
                          type: integer
                          example: 20
                        opened_at:
                          type: string
                          example: '2023-04-07T15:30:00.000000Z'
                        subscriber:
                          type: object
                          properties:
                            id:
                              type: integer
                              example: 20
                            email:
                              type: string
                              example: example@example.com
                            first_name:
                              type: string
                              example: John
                            last_name:
                              type: string
                              example: Doe
      tags:
        - 'Campaign Management'
      security: []
    parameters:
      -
        in: path
        name: id
        description: 'The ID of the campaign.'
        example: '1'
        required: true
        schema:
          type: string
  /api/register:
    post:
      summary: 'Register a new user'
      operationId: registerANewUser
      description: ''
      parameters: []
      responses:
        201:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'User registered successfully'
                  access_token: 1|example_token_hash
                  token_type: Bearer
                  user:
                    id: 1
                    name: 'John Doe'
                    email: user@example.com
                    email_verified_at: null
                    created_at: '2023-04-07T12:00:00.000000Z'
                    updated_at: '2023-04-07T12:00:00.000000Z'
                properties:
                  message:
                    type: string
                    example: 'User registered successfully'
                  access_token:
                    type: string
                    example: 1|example_token_hash
                  token_type:
                    type: string
                    example: Bearer
                  user:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      name:
                        type: string
                        example: 'John Doe'
                      email:
                        type: string
                        example: user@example.com
                      email_verified_at:
                        type: string
                        example: null
                      created_at:
                        type: string
                        example: '2023-04-07T12:00:00.000000Z'
                      updated_at:
                        type: string
                        example: '2023-04-07T12:00:00.000000Z'
      tags:
        - Endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'The name of the user.'
                  example: 'John Doe'
                  nullable: false
                email:
                  type: string
                  description: 'The email of the user.'
                  example: user@example.com
                  nullable: false
                password:
                  type: string
                  description: 'The password of the user.'
                  example: password123
                  nullable: false
                password_confirmation:
                  type: string
                  description: 'Password confirmation.'
                  example: password123
                  nullable: false
              required:
                - name
                - email
                - password
                - password_confirmation
      security: []
  /api/login:
    post:
      summary: ''
      operationId: postApiLogin
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: 'Must be a valid email address.'
                  example: gbailey@example.net
                  nullable: false
                password:
                  type: string
                  description: ''
                  example: '|]|{+-'
                  nullable: false
              required:
                - email
                - password
      security: []
  /api/logout:
    post:
      summary: ''
      operationId: postApiLogout
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Endpoints
      security: []
  /api/user:
    get:
      summary: ''
      operationId: getApiUser
      description: ''
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
      tags:
        - Endpoints
      security: []
  /api/newsletters:
    get:
      summary: ''
      operationId: getApiNewsletters
      description: ''
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
      tags:
        - Endpoints
      security: []
    post:
      summary: ''
      operationId: postApiNewsletters
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: b
                  nullable: false
                description:
                  type: string
                  description: ''
                  example: 'Eius et animi quos velit et.'
                  nullable: true
              required:
                - name
      security: []
  '/api/newsletters/{id}':
    get:
      summary: ''
