                  type: string
                  description: 'The <code>id</code> of an existing record in the newsletters table.'
                  example: architecto
                  nullable: false
                name:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: 'n'
                  nullable: false
                subject:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: g
                  nullable: false
                content:
                  type: string
                  description: ''
                  example: architecto
                  nullable: false
                status:
                  type: string
                  description: ''
                  example: sent
                  nullable: true
                  enum:
