            schema:
              type: object
              properties:
                email:
                  type: string
                  description: 'Must be a valid email address.'
                  example: gbailey@example.net
                  nullable: false
                first_name:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: m
                  nullable: true
                last_name:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: i
                  nullable: true
                newsletter_ids:
                  type: array
                  description: 'The <code>id</code> of an existing record in the newsletters table.'
                  example: null
                  items:
                    type: string
              required:
                - email
      security: []
