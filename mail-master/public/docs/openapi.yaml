      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                newsletter_id:
                  type: string
                  description: 'The <code>id</code> of an existing record in the newsletters table.'
                  example: architecto
                  nullable: false
                name:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: 'n'
                  nullable: false
                subject:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: g
                  nullable: false
                content:
                  type: string
                  description: ''
                  example: architecto
                  nullable: false
                status:
                  type: string
                  description: ''
                  example: draft
                  nullable: true
                  enum:
                    - draft
                    - scheduled
                    - sent
                scheduled_at:
                  type: string
                  description: 'Must be a valid date. Must be a date after <code>now</code>.'
                  example: '2051-05-09'
                  nullable: true
              required:
