                  example: b
                  nullable: true
                last_name:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: 'n'
                  nullable: true
                status:
                  type: string
                  description: ''
                  example: unsubscribed
                  nullable: true
                  enum:
                    - active
                    - unsubscribed
                newsletter_ids:
                  type: array
                  description: 'The <code>id</code> of an existing record in the newsletters table.'
                  example: null
                  items:
                    type: string
      security: []
    delete:
      summary: ''
      operationId: deleteApiSubscribersId
      description: ''
      parameters: []
      responses: {  }
      tags:
